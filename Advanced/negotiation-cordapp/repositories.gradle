repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://download.corda.net/maven/corda-dependencies' }
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    // Corda Enterprise (com.r3.corda:*) and the R3 libraries it uses (com.r3.*) are not on public repositories. Point this entry
    // at the repository your organisation serves them from, or install them into your local Maven repository (mavenLocal()).
    // Credentials: Gradle properties cordaArtifactoryUsername/cordaArtifactoryPassword or CORDA_ARTIFACTORY_USERNAME/PASSWORD
    // environment variables. SNAPSHOT versions are not on r3-corda-releases: use `publishToMavenLocal` or a snapshot repository.
    maven {
        url 'https://software.r3.com/artifactory/r3-corda-releases'
        credentials {
            username = findProperty('cordaArtifactoryUsername') ?: System.getenv('CORDA_ARTIFACTORY_USERNAME')
            password = findProperty('cordaArtifactoryPassword') ?: System.getenv('CORDA_ARTIFACTORY_PASSWORD')
        }
        content {
            includeGroupByRegex 'com\\.r3(\\..*)?'
        }
    }
}
